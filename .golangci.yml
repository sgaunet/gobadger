---
version: "2"
# Configure which files to skip during linting
run:
  tests: false

linters:
  default: all

  disable:
    - wsl
    - wsl_v5
    - nlreturn
    - depguard
    - gochecknoinits
    - gochecknoglobals
    - forbidigo
    - varnamelen
    - exhaustruct
    - tagliatelle
    - noinlineerr
    - revive
    - ireturn
    - gomodguard # deprecated since v2.12.0, superseded by gomodguard_v2 (enabled via default: all)